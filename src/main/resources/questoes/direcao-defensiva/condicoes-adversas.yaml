disciplina: direcao-defensiva
subtema: condicoes-adversas
origem: ia
questoes:
  - codigo: DDA-001
    revisada: true
    enunciado: >
      Ao dirigir durante o dia sob neblina, o condutor deve:
    alternativas:
      - texto: Usar o farol alto para enxergar mais longe.
      - texto: Manter os faróis acesos com luz baixa e reduzir a velocidade.
        correta: true
      - texto: Ligar o pisca-alerta e manter a velocidade da via.
      - texto: Manter os faróis apagados, já que é dia.
    explicacao: >
      A luz alta reflete nas gotículas da neblina e ofusca o próprio condutor. O CTB exige luz baixa
      mesmo durante o dia sob chuva, neblina ou cerração e em túneis. O pisca-alerta é para
      imobilizações e situações de emergência.
    referencia: CTB art. 40, I, b
    trecho_fonte: mesmo durante o dia, em túneis e sob chuva, neblina ou cerração

  - codigo: DDA-002
    revisada: true
    enunciado: >
      Em uma aquaplanagem, quando os pneus perdem o contato com o asfalto por causa de uma lâmina de
      água, a atitude correta é:
    alternativas:
      - texto: >
          Segurar firme o volante, manter a direção e tirar o pé do acelerador, sem frear bruscamente.
        correta: true
      - texto: Frear com força até o veículo parar.
      - texto: Virar o volante rapidamente em direção ao acostamento.
      - texto: Acelerar para que os pneus recuperem a aderência.
    explicacao: >
      Sem aderência, frear ou virar o volante bruscamente pode fazer o veículo rodar. O correto é manter
      o volante firme e reto e aliviar o acelerador até os pneus voltarem a tocar o piso. Pneus em bom
      estado e velocidade reduzida na chuva ajudam a evitar a aquaplanagem.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-003
    revisada: true
    enunciado: >
      À noite, ao ser ofuscado pelo farol de um veículo que vem em sentido contrário, o condutor deve:
    alternativas:
      - texto: Olhar fixamente para o farol até a visão se acostumar.
      - texto: Acender o farol alto para avisar o outro condutor.
      - texto: Fechar os olhos por alguns segundos.
      - texto: Desviar o olhar para a borda direita da pista e reduzir a velocidade, se necessário.
        correta: true
    explicacao: >
      Olhar para a linha de bordo à direita mantém a referência da pista sem receber a luz diretamente
      nos olhos. Revidar com farol alto coloca os dois condutores em risco.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-004
    revisada: true
    enunciado: >
      Chuva forte, neblina e vento lateral são exemplos de condições adversas de:
    alternativas:
      - texto: Luz.
      - texto: Via.
      - texto: Tempo.
        correta: true
      - texto: Trânsito.
    explicacao: >
      As condições adversas são agrupadas em seis tipos: luz, tempo, vias, trânsito, veículo e condutor.
      Chuva, neblina e vento são condições de tempo; ofuscamento e penumbra, de luz; buracos e falta de
      acostamento, de via.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-005
    revisada: true
    enunciado: >
      No começo de uma chuva, a pista costuma ficar ainda mais escorregadia porque:
    alternativas:
      - texto: A água se mistura com o óleo, a poeira e a borracha acumulados no asfalto.
        correta: true
      - texto: O asfalto esfria e fica mais duro.
      - texto: Os pneus esquentam demais.
      - texto: A chuva desliga o sistema de freios ABS.
    explicacao: >
      Nos primeiros minutos, a água forma uma pasta escorregadia com a sujeira do asfalto. Só depois de
      algum tempo de chuva a pista fica mais limpa. Reduza a velocidade e aumente a distância do veículo
      da frente desde as primeiras gotas.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-006
    revisada: true
    enunciado: >
      Ao amanhecer e ao entardecer, quando a luz natural é fraca, o condutor deve:
    alternativas:
      - texto: Usar a luz alta, mesmo em vias iluminadas.
      - texto: Acender o farol baixo, para ver e ser visto.
        correta: true
      - texto: Ligar apenas o pisca-alerta.
      - texto: Usar óculos escuros para diminuir o contraste.
    explicacao: >
      A penumbra é uma condição adversa de luz: os olhos demoram a se adaptar e os veículos com faróis
      apagados quase desaparecem. O farol baixo aceso ajuda o condutor a enxergar e, principalmente, a
      ser visto pelos outros.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-007
    revisada: true
    enunciado: >
      Em uma descida longa de serra, para não superaquecer os freios, o condutor deve:
    alternativas:
      - texto: Descer em ponto morto, para economizar combustível.
      - texto: Manter o pé no freio durante toda a descida.
      - texto: Usar uma marcha reduzida (freio-motor) e frear de forma intermitente.
        correta: true
      - texto: Desligar o motor e deixar o veículo descer sozinho.
    explicacao: >
      Freios usados sem parar esquentam e perdem eficiência. A marcha reduzida segura o veículo com o
      próprio motor. Descer desengrenado ou com o motor desligado, além de perigoso, é infração média
      (CTB art. 231, IX).
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDA-008
    revisada: true
    enunciado: >
      Ao ultrapassar um caminhão em uma rodovia com vento lateral forte, o condutor deve:
    alternativas:
      - texto: Acelerar bruscamente para sair logo da área de vento.
      - texto: Soltar o volante para que o carro se alinhe sozinho.
      - texto: Frear bruscamente ao lado do caminhão.
      - texto: Segurar o volante com firmeza e reduzir a velocidade, se for preciso.
        correta: true
    explicacao: >
      Ao passar pelo caminhão, o veículo sai da "sombra" do vento de repente e pode ser empurrado para o
      lado. Com as mãos firmes no volante e velocidade moderada, o condutor corrige a trajetória sem
      movimentos bruscos.
    referencia: Manual de Direção Defensiva (DENATRAN)
