disciplina: direcao-defensiva
subtema: evitar-colisoes
origem: ia
questoes:
  - codigo: DDE-001
    revisada: true
    enunciado: >
      Uma forma prática de manter distância segura do veículo da frente, em pista seca, é a "regra dos
      dois segundos". Ela consiste em:
    alternativas:
      - texto: Buzinar duas vezes antes de se aproximar do veículo da frente.
      - texto: >
          Contar pelo menos dois segundos entre a passagem do veículo da frente e a do seu veículo por um
          mesmo ponto fixo da via.
        correta: true
      - texto: Frear por dois segundos sempre que o veículo da frente reduzir a velocidade.
      - texto: Manter dois metros de distância em qualquer velocidade.
    explicacao: >
      Escolha um ponto fixo, como uma placa ou um poste. Quando o veículo da frente passar por ele, conte
      "mil e um, mil e dois". Se você chegar ao ponto antes de terminar a contagem, está perto demais.
      Com chuva ou à noite, aumente o intervalo.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDE-002
    revisada: true
    enunciado: >
      Segundo o CTB, a distância de segurança lateral e frontal que o condutor deve guardar em relação
      aos demais veículos depende:
    alternativas:
      - texto: Apenas da velocidade máxima da via.
      - texto: Apenas do tamanho dos veículos.
      - texto: Exclusivamente das placas de sinalização.
      - texto: >
          Da velocidade e das condições do local, da circulação, do veículo e das condições climáticas.
        correta: true
    explicacao: >
      A lei não fixa uma distância em metros: a distância segura varia com a velocidade, o local, o
      fluxo, o estado do veículo e o clima. Por isso existem referências práticas, como a regra dos dois
      segundos.
    referencia: CTB art. 29, II
    trecho_fonte: >
      considerando-se, no momento, a velocidade e as condições do local, da circulação, do veículo e as
      condições climáticas

  - codigo: DDE-003
    revisada: true
    enunciado: >
      Em regra, a ultrapassagem de outro veículo em movimento deve ser feita:
    alternativas:
      - texto: >
          Pela esquerda, exceto quando o veículo a ser ultrapassado estiver sinalizando que vai entrar à
          esquerda.
        correta: true
      - texto: Pela direita, que é a faixa dos veículos mais lentos.
      - texto: Pelo acostamento, quando ele estiver livre.
      - texto: Por qualquer lado, desde que com o pisca-alerta ligado.
    explicacao: >
      A ultrapassagem é feita pela esquerda. A exceção é quando o veículo da frente sinaliza que vai
      entrar à esquerda: nesse caso, passa-se pela direita. Ultrapassar pelo acostamento é infração
      gravíssima (art. 202, I).
    referencia: CTB art. 29, IX
    trecho_fonte: a ultrapassagem de outro veículo em movimento deverá ser feita pela esquerda

  - codigo: DDE-004
    revisada: true
    enunciado: >
      Você está na faixa da esquerda e percebe que o veículo de trás quer ultrapassá-lo. Você deve:
    alternativas:
      - texto: Acelerar para manter sua posição.
      - texto: Frear para que ele passe mais rápido.
      - texto: Deslocar-se para a faixa da direita, sem acelerar.
        correta: true
      - texto: Permanecer na faixa da esquerda, pois chegou primeiro.
    explicacao: >
      Quem está na faixa da esquerda deve ir para a faixa da direita, sem acelerar. Quem está nas demais
      faixas deve se manter na faixa em que está, também sem acelerar.
    referencia: CTB art. 30, I
    trecho_fonte: se estiver circulando pela faixa da esquerda, deslocar-se para a faixa da direita, sem acelerar a marcha

  - codigo: DDE-005
    revisada: true
    enunciado: >
      Antes de mudar de faixa, além de olhar os retrovisores e sinalizar, o condutor deve:
    alternativas:
      - texto: Buzinar para avisar os demais condutores.
      - texto: Verificar o ponto cego, olhando rapidamente por sobre o ombro.
        correta: true
      - texto: Acelerar bruscamente para concluir a manobra o quanto antes.
      - texto: Acender o farol alto.
    explicacao: >
      Os retrovisores não mostram tudo: há regiões ao lado e atrás do veículo (pontos cegos) onde motos
      e carros podem ficar escondidos. Uma olhada rápida por sobre o ombro evita colisões laterais.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDE-006
    revisada: true
    enunciado: >
      Em vias de mão dupla com pista única, a ultrapassagem é proibida, salvo sinalização que a permita:
    alternativas:
      - texto: Em curvas e aclives sem visibilidade, passagens de nível, pontes, viadutos e travessias de pedestres.
        correta: true
      - texto: Em retas com boa visibilidade.
      - texto: Nos trechos com linha seccionada.
      - texto: Durante o dia.
    explicacao: >
      São os locais em que o condutor não consegue ver quem vem em sentido contrário ou em que não há
      espaço de fuga. Em retas com visibilidade e linha seccionada, a ultrapassagem é permitida, sempre
      com segurança.
    referencia: CTB art. 32
    trecho_fonte: >
      nos trechos em curvas e em aclives sem visibilidade suficiente, nas passagens de nível, nas pontes
      e viadutos e nas travessias de pedestres

  - codigo: DDE-007
    revisada: true
    enunciado: >
      Um caminhão vai fazer uma curva à direita em um cruzamento. Para uma moto parada logo ao lado
      direito dele, o mais seguro é:
    alternativas:
      - texto: Ficar onde está, porque o motorista do caminhão vê tudo pelos retrovisores.
      - texto: Ficar atrás do caminhão e esperar, porque ao lado dele ela pode estar no ponto cego.
        correta: true
      - texto: Acelerar e passar à frente do caminhão durante a curva.
      - texto: Buzinar sem parar até o caminhão terminar a curva.
    explicacao: >
      Veículos grandes têm pontos cegos amplos, principalmente do lado direito, e ao fazer a curva a
      traseira "fecha" o espaço. Quem está ali pode ser atingido sem ser visto. Fique onde o motorista
      consiga ver você pelos retrovisores.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDE-008
    revisada: true
    enunciado: >
      O pisca-alerta deve ser usado:
    alternativas:
      - texto: Para parar rapidamente em fila dupla.
      - texto: Sob chuva forte, com o veículo em movimento.
      - texto: Em imobilizações ou situações de emergência, e quando a regulamentação da via determinar.
        correta: true
      - texto: Para agradecer a gentileza de outro condutor.
    explicacao: >
      O CTB só prevê o pisca-alerta nessas situações. Com o veículo em movimento na chuva, ele confunde
      os outros condutores, que podem achar que o veículo está parado, e impede que se veja a seta.
      Parar em fila dupla é infração, com ou sem pisca-alerta.
    referencia: CTB art. 40, V
    trecho_fonte: em imobilizações ou situações de emergência

  - codigo: DDE-009
    revisada: true
    enunciado: >
      Andar de marcha à ré por um trecho longo, para não ter de dar a volta no quarteirão, é:
    alternativas:
      - texto: Permitido, se o pisca-alerta estiver ligado.
      - texto: Permitido em vias locais.
      - texto: Infração leve.
      - texto: Infração grave, porque a marcha à ré só é permitida na distância necessária a pequenas manobras.
        correta: true
    explicacao: >
      Em marcha à ré, a visibilidade é menor e os outros condutores não esperam o movimento. Por isso o
      CTB só permite a ré em pequenas manobras e sem causar riscos; fora disso, é infração grave.
    referencia: CTB art. 194
    trecho_fonte: Transitar em marcha à ré, salvo na distância necessária a pequenas manobras
