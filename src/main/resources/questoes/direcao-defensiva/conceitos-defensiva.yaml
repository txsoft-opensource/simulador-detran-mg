disciplina: direcao-defensiva
subtema: conceitos-defensiva
origem: ia
questoes:
  - codigo: DDC-001
    revisada: true
    enunciado: >
      Direção defensiva é:
    alternativas:
      - texto: Dirigir sempre abaixo de 40 km/h, independentemente da via.
      - texto: >
          Dirigir de modo a evitar acidentes, apesar das ações incorretas dos outros e das condições
          adversas.
        correta: true
      - texto: Frear bruscamente sempre que outro condutor cometer um erro.
      - texto: Conhecer a mecânica do veículo para consertá-lo na estrada.
    explicacao: >
      Direção defensiva é dirigir reconhecendo antecipadamente as situações de perigo e prevendo o que
      pode acontecer, para evitar acidentes mesmo quando outras pessoas erram ou as condições não ajudam.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDC-002
    revisada: true
    enunciado: >
      São elementos da direção defensiva:
    alternativas:
      - texto: Velocidade, potência, reflexo, coragem e experiência.
      - texto: Habilitação, documentação, seguro, revisão e combustível.
      - texto: Atenção, velocidade, ultrapassagem, buzina e farol.
      - texto: Conhecimento, atenção, previsão, decisão e habilidade.
        correta: true
    explicacao: >
      São cinco elementos: conhecimento (das leis e do veículo), atenção (permanente ao trânsito),
      previsão (antecipar riscos), decisão (escolher a ação mais segura) e habilidade (executar as
      manobras com segurança).
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDC-003
    revisada: true
    enunciado: >
      Segundo o Código de Trânsito Brasileiro, o condutor deverá, a todo momento:
    alternativas:
      - texto: >
          Ter domínio de seu veículo, dirigindo-o com atenção e cuidados indispensáveis à segurança do
          trânsito.
        correta: true
      - texto: Manter a velocidade máxima permitida para não atrapalhar o fluxo.
      - texto: Usar a buzina antes de cada cruzamento.
      - texto: Trafegar pela faixa da esquerda em vias com várias faixas.
    explicacao: >
      O art. 28 resume a base da direção defensiva: domínio do veículo, atenção e cuidado constantes.
      A velocidade máxima é um limite, não uma meta, e a faixa da esquerda é destinada à ultrapassagem
      e aos veículos mais rápidos.
    referencia: CTB art. 28
    trecho_fonte: >
      O condutor deverá, a todo momento, ter domínio de seu veículo, dirigindo-o com atenção e cuidados
      indispensáveis à segurança do trânsito.

  - codigo: DDC-004
    revisada: true
    enunciado: >
      A capacidade de antecipar situações de risco, imaginando o que pode acontecer à frente para agir
      a tempo, corresponde ao elemento da direção defensiva chamado:
    alternativas:
      - texto: Habilidade.
      - texto: Conhecimento.
      - texto: Previsão.
        correta: true
      - texto: Decisão.
    explicacao: >
      Previsão é antecipar o perigo: perceber que uma bola rolando na calçada pode trazer uma criança
      atrás, ou que a porta de um carro estacionado pode se abrir. A decisão vem depois: é escolher a
      melhor ação diante do risco previsto.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDC-005
    revisada: true
    enunciado: >
      Segundo o CTB, ao regular a velocidade, o condutor deve observar constantemente:
    alternativas:
      - texto: As condições da via, do veículo e da carga, o tempo e a intensidade do trânsito.
        correta: true
      - texto: Apenas o limite máximo indicado nas placas.
      - texto: A velocidade dos outros veículos, acompanhando o fluxo mesmo acima do limite.
      - texto: Somente o horário, já que à noite o limite é menor.
    explicacao: >
      O limite da placa é o máximo, não a velocidade ideal. O art. 43 manda ajustar a velocidade às
      condições da via, do veículo, da carga, do tempo e do trânsito; sob chuva ou com a pista cheia, a
      velocidade segura pode ser bem menor que o limite.
    referencia: CTB art. 43
    trecho_fonte: >
      observar constantemente as condições físicas da via, do veículo e da carga, as condições
      meteorológicas e a intensidade do trânsito

  - codigo: DDC-006
    revisada: true
    enunciado: >
      A distância de parada de um veículo é a soma da:
    alternativas:
      - texto: Distância de seguimento com a distância lateral.
      - texto: Distância de reação com a distância de frenagem.
        correta: true
      - texto: Comprimento do veículo com a distância de frenagem.
      - texto: Distância de reação com a distância de ultrapassagem.
    explicacao: >
      A distância de reação é a que o veículo percorre entre o condutor perceber o perigo e pisar no
      freio; a de frenagem, a que ele percorre do acionamento do freio até parar. Cansaço, álcool e
      celular aumentam o tempo de reação e, com ele, a distância de parada.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDC-007
    revisada: true
    enunciado: >
      Se a velocidade dobrar, de 40 para 80 km/h, a distância de frenagem, nas mesmas condições, fica
      aproximadamente:
    alternativas:
      - texto: Duas vezes maior.
      - texto: Igual, porque depende só dos freios.
      - texto: Quatro vezes maior.
        correta: true
      - texto: Menor, porque o veículo fica mais estável.
    explicacao: >
      A energia que os freios precisam dissipar cresce com o quadrado da velocidade. Por isso, ao dobrar
      a velocidade, a distância de frenagem fica cerca de quatro vezes maior; é a razão de pequenos
      excessos de velocidade fazerem tanta diferença numa freada.
    referencia: Manual de Direção Defensiva (DENATRAN)

  - codigo: DDC-008
    revisada: true
    enunciado: >
      Para a direção defensiva, um acidente é considerado evitável quando:
    alternativas:
      - texto: É causado por uma falha mecânica.
      - texto: A culpa é do outro condutor.
      - texto: Acontece em um dia de chuva.
      - texto: O condutor poderia tê-lo impedido fazendo tudo o que razoavelmente estava ao seu alcance.
        correta: true
    explicacao: >
      O conceito não depende de quem tem a culpa: se havia algo razoável a fazer para evitar o acidente
      (reduzir a velocidade, manter distância, fazer a manutenção), ele era evitável. A maioria dos
      acidentes de trânsito se enquadra nesse caso.
    referencia: Manual de Direção Defensiva (DENATRAN)
