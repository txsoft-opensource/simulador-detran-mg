disciplina: legislacao
subtema: habilitacao
origem: ia
questoes:
  - codigo: HAB-001
    revisada: true
    enunciado: >
      Ao ser aprovado em todos os exames do processo de habilitação, o candidato recebe:
    alternativas:
      - texto: A Carteira Nacional de Habilitação definitiva, com validade de cinco anos.
      - texto: A Permissão para Dirigir, com validade de um ano.
        correta: true
      - texto: A Permissão para Dirigir, com validade de dois anos.
      - texto: Uma autorização provisória de 90 dias, válida até a emissão da CNH.
    explicacao: >
      O aprovado recebe primeiro a Permissão para Dirigir (PPD), válida por um ano. Só ao fim desse
      período, cumpridas as condições do § 3º do art. 148, recebe a CNH definitiva.
    referencia: CTB art. 148, § 2º
    trecho_fonte: Ao candidato aprovado será conferida Permissão para Dirigir, com validade de um ano.

  - codigo: HAB-002
    revisada: true
    enunciado: >
      O condutor com Permissão para Dirigir receberá a CNH definitiva ao fim de um ano, desde que,
      nesse período, não tenha:
    alternativas:
      - texto: Cometido nenhuma infração de trânsito, de qualquer natureza.
      - texto: Cometido mais de uma infração leve.
      - texto: Cometido infração média, mesmo que uma única vez.
      - texto: Cometido infração grave ou gravíssima, nem sido reincidente em infração média.
        correta: true
    explicacao: >
      Infrações leves não impedem a CNH, nem uma única infração média. O que impede é qualquer infração
      grave ou gravíssima, ou a reincidência em infração média. Sem cumprir isso, o candidato precisa
      reiniciar todo o processo de habilitação (§ 4º).
    referencia: CTB art. 148, § 3º
    trecho_fonte: >
      desde que o mesmo não tenha cometido nenhuma infração de natureza grave ou gravíssima ou seja
      reincidente em infração média

  - codigo: HAB-003
    revisada: true
    enunciado: >
      Um condutor habilitado apenas na categoria B pode dirigir:
    alternativas:
      - texto: Veículo de carga com peso bruto total de até 3.500 kg.
        correta: true
      - texto: Micro-ônibus com 12 lugares, além do motorista.
      - texto: Motocicleta de até 125 cilindradas.
      - texto: Caminhão com peso bruto total de 6.000 kg.
    explicacao: >
      A categoria B cobre veículos motorizados que não sejam de duas ou três rodas (categoria A), com
      peso bruto total de até 3.500 kg e até 8 lugares além do motorista. Motocicleta exige a categoria A,
      mais de 8 lugares exige a D e carga acima de 3.500 kg exige a C.
    referencia: CTB art. 143, II
    trecho_fonte: >
      cujo peso bruto total não exceda a três mil e quinhentos quilogramas e cuja lotação não exceda a
      oito lugares, excluído o do motorista

  - codigo: HAB-004
    revisada: true
    enunciado: >
      Para se habilitar, o candidato precisa, entre outros requisitos:
    alternativas:
      - texto: Ter concluído o ensino médio.
      - texto: Ser penalmente imputável, saber ler e escrever e ter documento de identidade.
        correta: true
      - texto: Ter pelo menos 21 anos de idade.
      - texto: Possuir um veículo registrado em seu nome.
    explicacao: >
      O art. 140 exige três requisitos: ser penalmente imputável (no Brasil, ter 18 anos ou mais), saber
      ler e escrever e possuir carteira de identidade ou documento equivalente. Não há exigência de
      escolaridade mínima nem de veículo próprio.
    referencia: CTB art. 140
    trecho_fonte: ser penalmente imputável

  - codigo: HAB-005
    revisada: true
    enunciado: >
      Um condutor de 45 anos deve renovar o exame de aptidão física e mental, em regra, a cada:
    alternativas:
      - texto: 3 anos.
      - texto: 5 anos.
      - texto: 10 anos.
        correta: true
      - texto: 15 anos.
    explicacao: >
      Desde a Lei 14.071/2020, o prazo depende da idade: a cada 10 anos para quem tem menos de 50, a cada
      5 anos de 50 até 69 e a cada 3 anos a partir dos 70. O médico perito pode reduzir o prazo se
      houver indício de condição que exija acompanhamento.
    referencia: CTB art. 147, § 2º, I
    trecho_fonte: a cada 10 (dez) anos, para condutores com idade inferior a 50 (cinquenta) anos

  - codigo: HAB-006
    revisada: true
    enunciado: >
      Dirigir com a Carteira Nacional de Habilitação vencida há mais de 30 dias é:
    alternativas:
      - texto: Permitido, porque a tolerância depois do vencimento é de 60 dias.
      - texto: Infração leve, punida apenas com advertência por escrito.
      - texto: Infração média, com multa.
      - texto: Infração gravíssima, com multa e retenção do veículo até a apresentação de condutor habilitado.
        correta: true
    explicacao: >
      Até 30 dias depois do vencimento não há infração. Passado esse prazo, dirigir com a CNH vencida é
      infração gravíssima, com multa, e o veículo fica retido até chegar um condutor habilitado.
    referencia: CTB art. 162, V
    trecho_fonte: com Carteira Nacional de Habilitação vencida há mais de 30 (trinta) dias
