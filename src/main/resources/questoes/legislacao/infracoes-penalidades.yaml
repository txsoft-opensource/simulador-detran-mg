disciplina: legislacao
subtema: infracoes-penalidades
origem: ia
questoes:
  - codigo: INF-001
    revisada: true
    enunciado: >
      O condutor que soma 30 pontos em 12 meses, sendo uma das infrações gravíssima, terá o direito
      de dirigir:
    alternativas:
      - texto: Mantido, pois o limite é de 40 pontos para qualquer condutor.
      - texto: Mantido, pois só há suspensão com duas ou mais infrações gravíssimas.
      - texto: Suspenso, pois com uma infração gravíssima o limite é de 30 pontos.
        correta: true
      - texto: Cassado imediatamente.
    explicacao: >
      Desde a Lei 14.071/2020, o limite em 12 meses depende das gravíssimas: 20 pontos com duas ou mais,
      30 com uma e 40 com nenhuma. Muitos simulados antigos ainda usam a regra anterior (20 pontos para
      todos).
    referencia: CTB art. 261, I, b
    trecho_fonte: 30 (trinta) pontos, caso conste 1 (uma) infração gravíssima na pontuação

  - codigo: INF-002
    revisada: true
    enunciado: >
      Dirigir sob a influência de álcool é infração:
    alternativas:
      - texto: Gravíssima, com multa multiplicada por dez e suspensão do direito de dirigir por 12 meses.
        correta: true
      - texto: Gravíssima, com multa multiplicada por três e apreensão do veículo.
      - texto: Grave, com multa e retenção do veículo.
      - texto: Gravíssima, com multa simples e suspensão do direito de dirigir por 6 meses.
    explicacao: >
      É a infração do art. 165: gravíssima, multa (dez vezes) e suspensão por 12 meses, com recolhimento
      do documento de habilitação e retenção do veículo. A multa dobra em caso de reincidência em 12 meses,
      e qualquer concentração de álcool já sujeita o condutor a essas penalidades (art. 276).
    referencia: CTB art. 165
    trecho_fonte: Penalidade - multa (dez vezes) e suspensão do direito de dirigir por 12 (doze) meses.

  - codigo: INF-003
    revisada: true
    enunciado: >
      Dirigir segurando ou manuseando o telefone celular é infração:
    alternativas:
      - texto: Leve.
      - texto: Média.
      - texto: Grave.
      - texto: Gravíssima.
        correta: true
    explicacao: >
      Dirigir usando fones de ouvido ou telefone celular é infração média (art. 252, VI). Se o condutor
      estiver segurando ou manuseando o aparelho, a infração passa a ser gravíssima.
    referencia: CTB art. 252, parágrafo único
    trecho_fonte: >
      caracterizar-se-á como infração gravíssima no caso de o condutor estar segurando ou manuseando
      telefone celular

  - codigo: INF-004
    revisada: true
    enunciado: >
      Quantos pontos são computados no prontuário do condutor por uma infração grave?
    alternativas:
      - texto: Três.
      - texto: Cinco.
        correta: true
      - texto: Quatro.
      - texto: Sete.
    explicacao: >
      Cada infração soma pontos conforme a natureza: gravíssima, 7 pontos; grave, 5; média, 4; leve, 3.
    referencia: CTB art. 259, II
    trecho_fonte: II - grave - cinco pontos;

  - codigo: INF-005
    revisada: true
    enunciado: >
      Avançar o sinal vermelho do semáforo é infração:
    alternativas:
      - texto: Grave, com multa e retenção do veículo.
      - texto: Média, com multa.
      - texto: Gravíssima, com multa.
        correta: true
      - texto: Gravíssima, com multa e suspensão imediata do direito de dirigir.
    explicacao: >
      É infração gravíssima, punida com multa e 7 pontos no prontuário, mas sem suspensão direta do
      direito de dirigir. A exceção é a livre conversão à direita, quando houver sinalização que a
      permita (art. 44-A).
    referencia: CTB art. 208
    trecho_fonte: Avançar o sinal vermelho do semáforo ou o de parada obrigatória

  - codigo: INF-006
    revisada: true
    enunciado: >
      Deixar o condutor ou um passageiro de usar o cinto de segurança é infração:
    alternativas:
      - texto: Leve, punida com advertência por escrito.
      - texto: Média, com multa, e só vale para o condutor.
      - texto: Gravíssima, com suspensão do direito de dirigir.
      - texto: Grave, com multa e retenção do veículo até a colocação do cinto.
        correta: true
    explicacao: >
      A infração é grave e vale tanto para o condutor quanto para os passageiros. Além da multa, o
      veículo fica retido até que o infrator coloque o cinto.
    referencia: CTB art. 167
    trecho_fonte: retenção do veículo até colocação do cinto pelo infrator

  - codigo: INF-007
    revisada: true
    enunciado: >
      Um condutor é flagrado a 130 km/h em uma via cujo limite é de 80 km/h, ou seja, mais de 50% acima
      do permitido. A infração é:
    alternativas:
      - texto: Gravíssima, com multa multiplicada por três e suspensão do direito de dirigir.
        correta: true
      - texto: Grave, com multa.
      - texto: Média, com multa.
      - texto: Gravíssima, com multa simples e remoção do veículo.
    explicacao: >
      O art. 218 gradua o excesso de velocidade: até 20% acima, média; de 20% a 50%, grave; mais de 50%,
      gravíssima, com multa três vezes maior e suspensão do direito de dirigir.
    referencia: CTB art. 218, III
    trecho_fonte: >
      quando a velocidade for superior à máxima em mais de 50% (cinqüenta por cento): Infração -
      gravíssima; Penalidade - multa (três vezes) e suspensão do direito de dirigir

  - codigo: INF-008
    revisada: true
    enunciado: >
      O condutor que se recusa a fazer o teste do etilômetro (bafômetro) em uma fiscalização:
    alternativas:
      - texto: Não sofre penalidade, porque ninguém é obrigado a produzir prova contra si.
      - texto: Comete infração gravíssima, com multa multiplicada por dez e suspensão do direito de dirigir por 12 meses.
        correta: true
      - texto: Comete infração média, com multa.
      - texto: Só é penalizado se tiver sinais visíveis de embriaguez.
    explicacao: >
      A recusa é uma infração própria (art. 165-A), com as mesmas penalidades de dirigir sob influência
      de álcool, mesmo sem sinais de embriaguez. Recusar o teste não é crime por si só; o crime do art.
      306 depende da capacidade psicomotora alterada.
    referencia: CTB art. 165-A
    trecho_fonte: >
      Recusar-se a ser submetido a teste, exame clínico, perícia ou outro procedimento que permita
      certificar influência de álcool
