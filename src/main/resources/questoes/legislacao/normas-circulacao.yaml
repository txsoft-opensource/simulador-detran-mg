disciplina: legislacao
subtema: normas-circulacao
origem: ia
questoes:
  - codigo: CIR-001
    revisada: true
    enunciado: >
      Em uma via urbana coletora sem sinalização de velocidade, a velocidade máxima permitida é de:
    alternativas:
      - texto: 30 km/h
      - texto: 40 km/h
        correta: true
      - texto: 50 km/h
      - texto: 60 km/h
    explicacao: >
      Sem placa de velocidade, vale o limite do tipo de via urbana: 80 km/h nas vias de trânsito rápido,
      60 km/h nas arteriais, 40 km/h nas coletoras e 30 km/h nas locais.
    referencia: CTB art. 61, § 1º, I, c
    trecho_fonte: quarenta quilômetros por hora, nas vias coletoras

  - codigo: CIR-002
    revisada: true
    enunciado: >
      Ao chegar a uma rotatória sem sinalização, quem tem a preferência de passagem?
    alternativas:
      - texto: O veículo que vier pela direita do condutor.
      - texto: O veículo de maior porte.
      - texto: O veículo que já estiver circulando pela rotatória.
        correta: true
      - texto: O veículo que vier pela via de maior movimento.
    explicacao: >
      Em local não sinalizado, a regra geral é a preferência de quem vem pela direita. A rotatória é uma
      exceção: tem preferência quem já está circulando por ela.
    referencia: CTB art. 29, III, b
    trecho_fonte: no caso de rotatória, aquele que estiver circulando por ela

  - codigo: CIR-003
    revisada: true
    enunciado: >
      Sobre o uso do cinto de segurança, é correto afirmar que ele é obrigatório:
    alternativas:
      - texto: >
          Para o condutor e todos os passageiros, em todas as vias do território nacional, salvo
          situações regulamentadas pelo CONTRAN.
        correta: true
      - texto: Apenas para o condutor e o passageiro do banco da frente.
      - texto: Somente em rodovias e vias de trânsito rápido.
      - texto: Apenas para passageiros maiores de 10 anos.
    explicacao: >
      O cinto é obrigatório para todos os ocupantes, em qualquer via, inclusive nas urbanas e no banco
      de trás. As únicas exceções são as regulamentadas pelo CONTRAN.
    referencia: CTB art. 65
    trecho_fonte: >
      É obrigatório o uso do cinto de segurança para condutor e passageiros em todas as vias do
      território nacional

  - codigo: CIR-004
    revisada: true
    enunciado: >
      Uma criança de 8 anos, com 1,30 m de altura, deve ser transportada:
    alternativas:
      - texto: No banco dianteiro, desde que use o cinto de segurança de três pontos.
      - texto: No banco traseiro, usando apenas o cinto de segurança do veículo.
      - texto: Em qualquer banco, no colo de um adulto que esteja usando o cinto.
      - texto: No banco traseiro, em dispositivo de retenção adequado à sua idade, peso e altura.
        correta: true
    explicacao: >
      Crianças com menos de 10 anos que ainda não atingiram 1,45 m vão no banco traseiro, em dispositivo
      de retenção adequado (cadeirinha ou assento de elevação). Levar a criança no colo descumpre a regra.
    referencia: CTB art. 64
    trecho_fonte: >
      As crianças com idade inferior a 10 (dez) anos que não tenham atingido 1,45 m (um metro e quarenta
      e cinco centímetros) de altura devem ser transportadas nos bancos traseiros

  - codigo: CIR-005
    revisada: true
    enunciado: >
      Em uma rodovia de pista dupla sem placa de velocidade, a velocidade máxima permitida para um
      automóvel é de:
    alternativas:
      - texto: 110 km/h.
        correta: true
      - texto: 100 km/h.
      - texto: 90 km/h.
      - texto: 120 km/h.
    explicacao: >
      Sem sinalização, valem os limites do art. 61. Nas rodovias de pista dupla, 110 km/h para automóveis,
      camionetas, caminhonetes e motocicletas e 90 km/h para os demais veículos. Nas de pista simples,
      100 km/h e 90 km/h.
    referencia: CTB art. 61, § 1º, II, a, 1
    trecho_fonte: >
      110 km/h (cento e dez quilômetros por hora) para automóveis, camionetas, caminhonetes e motocicletas

  - codigo: CIR-006
    revisada: true
    enunciado: >
      Durante o dia, sem chuva nem neblina, em uma rodovia de pista simples fora do perímetro urbano, o
      uso do farol aceso é:
    alternativas:
      - texto: Obrigatório para todos os veículos.
      - texto: Obrigatório para os veículos que não têm luz de rodagem diurna (DRL).
        correta: true
      - texto: Proibido, porque o farol só pode ser usado à noite.
      - texto: Opcional para todos os veículos.
    explicacao: >
      A Lei 14.071/2020 mudou a regra. O farol aceso de dia nessas rodovias continua obrigatório, mas só
      para os veículos sem luz de rodagem diurna; nos que têm, a DRL já cumpre a função de tornar o
      veículo visível. Muitos simulados antigos ainda dizem que vale para todos.
    referencia: CTB art. 40, § 2º
    trecho_fonte: >
      os veículos que não dispuserem de luzes de rodagem diurna deverão manter acesos os faróis nas
      rodovias de pista simples situadas fora dos perímetros urbanos, mesmo durante o dia

  - codigo: CIR-007
    revisada: true
    enunciado: >
      Dois veículos chegam ao mesmo tempo a um cruzamento sem sinalização. Não é uma rotatória e nenhum
      deles vem de uma rodovia. Tem preferência:
    alternativas:
      - texto: O que estiver em maior velocidade.
      - texto: O veículo de maior porte.
      - texto: O que vier pela direita do condutor.
        correta: true
      - texto: O que vier pela esquerda do condutor.
    explicacao: >
      Em cruzamento não sinalizado, o art. 29, III, dá preferência a quem vem da rodovia; na rotatória,
      a quem já circula por ela; nos demais casos, a quem vem pela direita.
    referencia: CTB art. 29, III, c
    trecho_fonte: nos demais casos, o que vier pela direita do condutor

  - codigo: CIR-008
    revisada: true
    enunciado: >
      À noite, em uma via sem iluminação pública, o condutor deve usar:
    alternativas:
      - texto: Apenas a lanterna (luz de posição).
      - texto: Luz baixa o tempo todo.
      - texto: Luz alta junto com o pisca-alerta.
      - texto: Luz alta, trocando para a baixa ao cruzar com outro veículo ou ao segui-lo.
        correta: true
    explicacao: >
      Nas vias não iluminadas, a luz alta é a regra, mas ela ofusca quem vem em sentido contrário e quem
      está logo à frente; por isso, nesses momentos, troca-se para a baixa. O pisca-alerta é só para
      imobilizações e emergências.
    referencia: CTB art. 40, II
    trecho_fonte: >
      nas vias não iluminadas o condutor deve usar luz alta, exceto ao cruzar com outro veículo ou ao
      segui-lo
