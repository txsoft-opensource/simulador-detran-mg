disciplina: legislacao
subtema: sinalizacao-luminosa-gestos
origem: ia
questoes:
  - codigo: SLG-001
    revisada: true
    enunciado: >
      O semáforo está verde para você, mas o agente de trânsito no cruzamento faz sinal para que você
      pare. O que prevalece?
    alternativas:
      - texto: A ordem do agente de trânsito.
        correta: true
      - texto: O semáforo, por ser sinalização oficial.
      - texto: A placa de regulamentação mais próxima.
      - texto: A preferência de quem vem pela direita.
    explicacao: >
      A ordem de prevalência é: agente de trânsito, depois semáforo, depois os demais sinais e, por
      último, as normas gerais de circulação. A ordem do agente vale mesmo contra o semáforo.
    referencia: CTB art. 89, I
    trecho_fonte: as ordens do agente de trânsito sobre as normas de circulação e outros sinais

  - codigo: SLG-002
    revisada: true
    enunciado: >
      O agente de trânsito com o braço levantado verticalmente e a palma da mão para a frente indica:
    alternativas:
      - texto: Siga em frente com cautela.
      - texto: Diminua a velocidade.
      - texto: Ordem de parada para todos os veículos.
        correta: true
      - texto: Passagem liberada apenas para pedestres.
    explicacao: >
      Braço erguido na vertical, com a palma da mão para a frente, é ordem de parada obrigatória para
      todos os veículos. Quem já estiver dentro do cruzamento não é obrigado a parar.
    referencia: Anexo II do CTB (sinalização) - gestos dos agentes de trânsito

  - codigo: SLG-003
    revisada: true
    enunciado: >
      Durante a fiscalização, o agente de trânsito emite dois silvos breves de apito. Isso significa:
    alternativas:
      - texto: Siga.
      - texto: Pare.
        correta: true
      - texto: Diminua a marcha.
      - texto: Estacione no acostamento.
    explicacao: >
      Sinais sonoros do apito: um silvo breve quer dizer "siga", dois silvos breves quer dizer "pare" e
      um silvo longo quer dizer "diminua a marcha".
    referencia: Anexo II do CTB (sinalização) - sinais sonoros

  - codigo: SLG-004
    revisada: true
    enunciado: >
      Ao se aproximar de um semáforo que acabou de mudar para o amarelo, o condutor deve:
    alternativas:
      - texto: Parar o veículo, salvo se isso puser em perigo os veículos que vêm atrás.
        correta: true
      - texto: Acelerar para passar antes do vermelho.
      - texto: Buzinar e seguir em frente.
      - texto: Parar imediatamente, mesmo que seja sobre a faixa de pedestres.
    explicacao: >
      O amarelo significa atenção: o condutor deve parar, a não ser que a parada brusca crie risco de
      colisão com quem vem atrás. Acelerar para "pegar o amarelo" é a origem de muitas colisões em
      cruzamentos.
    referencia: Anexo II do CTB (sinalização) - sinais luminosos

  - codigo: SLG-005
    revisada: true
    enunciado: >
      Um semáforo veicular com a luz amarela piscando (intermitente) indica que o condutor deve:
    alternativas:
      - texto: Parar obrigatoriamente, como no vermelho.
      - texto: Reduzir a velocidade e redobrar a atenção, respeitando as regras de preferência.
        correta: true
      - texto: Seguir sem cuidado especial, porque o semáforo está desligado.
      - texto: Esperar um agente de trânsito autorizar a passagem.
    explicacao: >
      O amarelo intermitente indica atenção: o semáforo não está controlando o cruzamento naquele momento.
      O condutor reduz a velocidade e segue as placas e as regras gerais de preferência, como a de quem
      vem pela direita.
    referencia: Anexo II do CTB (sinalização) - sinais luminosos
