disciplina: meio-ambiente
subtema: poluicao
origem: ia
questoes:
  - codigo: MAP-001
    revisada: true
    enunciado: >
      Transitar com o veículo produzindo fumaça, gases ou partículas em níveis superiores aos fixados
      pelo CONTRAN é infração:
    alternativas:
      - texto: Leve.
      - texto: Grave.
        correta: true
      - texto: Média.
      - texto: Gravíssima.
    explicacao: >
      É infração grave, com multa e retenção do veículo para regularização. Manter a manutenção em dia
      (regulagem do motor, filtros e catalisador) mantém as emissões dentro dos limites.
    referencia: CTB art. 231, III
    trecho_fonte: produzindo fumaça, gases ou partículas em níveis superiores aos fixados pelo CONTRAN

  - codigo: MAP-002
    revisada: true
    enunciado: >
      Atirar do veículo ou abandonar na via objetos ou substâncias é:
    alternativas:
      - texto: Permitido, se o objeto for biodegradável.
      - texto: Infração leve.
      - texto: Permitido em rodovias, fora do perímetro urbano.
      - texto: Infração média.
        correta: true
    explicacao: >
      Jogar lixo pela janela é infração média, além de poluir e poder causar acidentes: latas e garrafas
      na pista atingem outros veículos, e pontas de cigarro provocam incêndios na vegetação.
    referencia: CTB art. 172
    trecho_fonte: >
      Atirar do veículo ou abandonar na via objetos ou substâncias: Infração - média;

  - codigo: MAP-003
    revisada: true
    enunciado: >
      Usar no veículo equipamento de som em volume ou frequência não autorizados pelo CONTRAN é:
    alternativas:
      - texto: Infração grave, com retenção do veículo para regularização.
        correta: true
      - texto: Infração leve, punida apenas com advertência.
      - texto: Permitido durante o dia.
      - texto: Permitido se as janelas estiverem fechadas.
    explicacao: >
      A poluição sonora também é um problema ambiental e de convívio. Som acima do permitido é infração
      grave, com multa e retenção do veículo para regularização.
    referencia: CTB art. 228
    trecho_fonte: >
      Usar no veículo equipamento com som em volume ou freqüência que não sejam autorizados pelo
      CONTRAN: Infração - grave;

  - codigo: MAP-004
    revisada: true
    enunciado: >
      A principal função do catalisador, instalado no sistema de escapamento, é:
    alternativas:
      - texto: Aumentar a potência do motor.
      - texto: Reduzir o barulho do escapamento.
      - texto: Transformar gases tóxicos, como o monóxido de carbono, em gases menos nocivos.
        correta: true
      - texto: Diminuir o consumo de combustível.
    explicacao: >
      O catalisador converte monóxido de carbono, hidrocarbonetos e óxidos de nitrogênio em gases menos
      prejudiciais. Quem reduz o barulho é o silencioso. Retirar ou danificar o catalisador aumenta muito
      a poluição.
    referencia: Res. CONTRAN 789/2020 - curso teórico, meio ambiente e convívio social

  - codigo: MAP-005
    revisada: true
    enunciado: >
      Uma atitude do condutor que reduz o consumo de combustível e a emissão de poluentes é:
    alternativas:
      - texto: Acelerar forte nas saídas de semáforo.
      - texto: Deixar o motor ligado com o veículo parado por muito tempo.
      - texto: Rodar com os pneus abaixo da calibragem recomendada.
      - texto: Manter o motor regulado, os pneus calibrados e acelerar de forma suave.
        correta: true
    explicacao: >
      Motor desregulado e pneus murchos aumentam o consumo, e acelerações bruscas desperdiçam
      combustível. Direção suave e manutenção em dia poluem menos e economizam dinheiro.
    referencia: Res. CONTRAN 789/2020 - curso teórico, meio ambiente e convívio social

  - codigo: MAP-006
    revisada: true
    enunciado: >
      O óleo lubrificante usado, retirado na troca de óleo do motor, deve ser:
    alternativas:
      - texto: Deixado no posto ou na oficina, para ser coletado e rerrefinado.
        correta: true
      - texto: Despejado na rede de esgoto.
      - texto: Queimado em um terreno baldio.
      - texto: Enterrado longe de rios.
    explicacao: >
      Um litro de óleo usado contamina uma enorme quantidade de água e solo. A regra é a coleta e o
      rerrefino: postos e oficinas que fazem a troca são obrigados a recolher o óleo e destiná-lo
      corretamente.
    referencia: Res. CONAMA 362/2005 (óleo lubrificante usado)
