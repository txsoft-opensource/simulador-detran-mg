disciplina: meio-ambiente
subtema: cidadania
origem: ia
questoes:
  - codigo: MAC-001
    revisada: true
    enunciado: >
      De acordo com o CTB, o trânsito em condições seguras é:
    alternativas:
      - texto: Responsabilidade exclusiva dos condutores profissionais.
      - texto: Um privilégio de quem possui veículo.
      - texto: Um direito de todos e dever dos órgãos e entidades do Sistema Nacional de Trânsito.
        correta: true
      - texto: Uma obrigação apenas da polícia rodoviária.
    explicacao: >
      O art. 1º, § 2º, coloca o trânsito seguro como direito de todos (pedestres, ciclistas, passageiros
      e condutores) e obriga os órgãos de trânsito a adotarem medidas para garanti-lo.
    referencia: CTB art. 1º, § 2º
    trecho_fonte: >
      O trânsito, em condições seguras, é um direito de todos e dever dos órgãos e entidades componentes
      do Sistema Nacional de Trânsito

  - codigo: MAC-002
    revisada: true
    enunciado: >
      Estacionar nas vagas reservadas às pessoas com deficiência ou idosos sem a credencial que comprove
      essa condição é infração:
    alternativas:
      - texto: Leve, com advertência por escrito.
      - texto: Gravíssima, com remoção do veículo.
        correta: true
      - texto: Média, punida apenas com multa.
      - texto: Grave, com retenção do veículo.
    explicacao: >
      É infração gravíssima, com multa e remoção do veículo. Além da penalidade, é uma questão de
      respeito: a vaga existe para quem tem mobilidade reduzida.
    referencia: CTB art. 181, XX
    trecho_fonte: >
      nas vagas reservadas às pessoas com deficiência ou idosos, sem credencial que comprove tal
      condição: Infração - gravíssima;

  - codigo: MAC-003
    revisada: true
    enunciado: >
      Uma ambulância com a sirene e as luzes intermitentes acionadas se aproxima por trás. Todos os
      condutores devem:
    alternativas:
      - texto: Acelerar para abrir espaço à frente.
      - texto: Parar imediatamente onde estiverem, mesmo na faixa da esquerda.
      - texto: Seguir normalmente, pois a ambulância deve ultrapassar pela direita.
      - texto: Deixar livre a faixa da esquerda, indo para a direita da via e parando, se necessário.
        correta: true
    explicacao: >
      Com o alarme sonoro e a iluminação intermitente acionados, ambulâncias, bombeiros e polícia têm
      prioridade. Libere a faixa da esquerda indo para a direita e pare, se for preciso.
    referencia: CTB art. 29, VII, a
    trecho_fonte: >
      todos os condutores deverão deixar livre a passagem pela faixa da esquerda, indo para a direita da
      via e parando, se necessário

  - codigo: MAC-004
    revisada: true
    enunciado: >
      Segundo o CTB, a buzina só pode ser usada:
    alternativas:
      - texto: Para cumprimentar conhecidos e chamar pessoas.
      - texto: Em toque breve, para advertências que evitem sinistros e, fora das áreas urbanas, para avisar que vai ultrapassar.
        correta: true
      - texto: Sempre que o trânsito estiver parado.
      - texto: A qualquer hora, desde que em toque prolongado.
    explicacao: >
      O art. 41 limita a buzina a toques breves nessas duas situações. Usá-la fora delas, em toque
      prolongado ou entre as 22h e as 6h, é infração leve (art. 227).
    referencia: CTB art. 41
    trecho_fonte: só poderá fazer uso de buzina, desde que em toque breve

  - codigo: MAC-005
    revisada: true
    enunciado: >
      Passar com o veículo sobre uma poça e jogar água nos pedestres que estão na calçada é:
    alternativas:
      - texto: Permitido, se o condutor estiver dentro do limite de velocidade.
      - texto: Só falta de educação, sem penalidade.
      - texto: Infração média, com multa.
        correta: true
      - texto: Crime de trânsito.
    explicacao: >
      Arremessar água ou detritos sobre pedestres ou veículos é infração média (art. 171). Em dia de
      chuva, reduza a velocidade perto das calçadas e desvie das poças quando for seguro.
    referencia: CTB art. 171
    trecho_fonte: Usar o veículo para arremessar, sobre os pedestres ou veículos, água ou detritos

  - codigo: MAC-006
    revisada: true
    enunciado: >
      De acordo com o CTB, a educação para o trânsito:
    alternativas:
      - texto: É responsabilidade apenas das autoescolas.
      - texto: Só é obrigatória para quem vai tirar a CNH.
      - texto: É opcional para os órgãos de trânsito.
      - texto: É direito de todos e dever prioritário dos órgãos do Sistema Nacional de Trânsito.
        correta: true
    explicacao: >
      O art. 74 trata a educação para o trânsito como direito de todos os cidadãos, e não só de quem está
      se habilitando, e a coloca como dever prioritário dos órgãos e entidades do Sistema Nacional de
      Trânsito.
    referencia: CTB art. 74
    trecho_fonte: >
      A educação para o trânsito é direito de todos e constitui dever prioritário para os componentes do
      Sistema Nacional de Trânsito
